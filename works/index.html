  --tape:rgba(238,90,109,.30); --tape-2:rgba(255,255,255,.55);
  --shadow:rgba(30,60,120,.22);

  --c-v-bg:#dbe6ff; --c-v-fg:#23409e; --c-v-dot:#3b5bdb;
  --c-s-bg:#ecdcf7; --c-s-fg:#6b1f87; --c-s-dot:#9c36b5;
  --c-z-bg:#ffe3d1; --c-z-fg:#9a3d06; --c-z-dot:#e8590c;
  --c-r-bg:#cdeff3; --c-r-fg:#0a5560; --c-r-dot:#0b7285;
  --c-m-bg:#fbdbe7; --c-m-fg:#94163f; --c-m-dot:#c2255c;
  --c-e-bg:#d6f0dc; --c-e-fg:#1f6a30; --c-e-dot:#2f9e44;
  --c-l-bg:#ffd9d9; --c-l-fg:#a82121; --c-l-dot:#e03131;
  --c-o-bg:#e2e7f0; --c-o-fg:#46546e; --c-o-dot:#7b8aa5;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:linear-gradient(180deg,var(--desk-1),var(--desk-2)) var(--desk-2);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--font-body);font-size:16px;line-height:1.6;
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100%;
}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:6px}

.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{
  display:inline-flex;align-items:center;gap:10px;min-height:56px;text-decoration:none;font-size:15px;cursor:pointer;
}
.back .sticker-slot{
  position:relative;overflow:hidden;width:60px;height:60px;border-radius:15px;font-size:10px;
  animation:nudge 4.8s ease-in-out infinite;transition:transform .2s;
}
.back .sticker-slot::after{
  content:"";position:absolute;inset:0;transform:translateX(-130%);
  background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.8) 50%,transparent 65%);
  animation:shine 4.8s ease-in-out infinite;
}
.back:hover .sticker-slot,.back:focus-visible .sticker-slot{animation:none;transform:rotate(4deg) scale(1.1)}
@keyframes nudge{
  0%,68%,100%{transform:rotate(-5deg) translateY(0)}
  76%{transform:rotate(-11deg) translateY(-4px)}
  84%{transform:rotate(2deg) translateY(-4px)}
  92%{transform:rotate(-7deg) translateY(0)}
}
@keyframes shine{0%,70%{transform:translateX(-130%)}92%,100%{transform:translateX(130%)}}

/* 點點紙 */
.sheet{
  position:relative;
  background:
    radial-gradient(circle,var(--paper-dot) 1.1px,transparent 1.3px) 0 0/22px 22px,
    var(--paper);
  border-radius:20px;
  padding:34px 26px 28px;
  box-shadow:0 22px 40px -22px var(--shadow),0 2px 0 var(--line) inset;
  display:flex;flex-direction:column;gap:18px;
}
.sheet::before,.sheet::after{
  content:"";position:absolute;top:-10px;width:92px;height:26px;
  background:repeating-linear-gradient(90deg,var(--tape-2) 0 7px,transparent 7px 14px),var(--tape);
  box-shadow:0 2px 4px -1px var(--shadow);
}
.sheet::before{left:26px;transform:rotate(-4deg)}
.sheet::after{right:26px;transform:rotate(3deg)}

.head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{
  margin:0;font-family:var(--font-hand);font-weight:400;
  font-size:clamp(44px,9vw,60px);line-height:1;letter-spacing:.04em;color:var(--denim);
}
.sticker-slot{
  width:68px;height:68px;border-radius:16px;transform:rotate(-5deg);
  background:repeating-linear-gradient(135deg,var(--surface-2) 0 8px,var(--line) 8px 16px);
  border:3px solid var(--surface);box-shadow:0 8px 14px -8px var(--shadow);
  display:grid;place-items:center;text-align:center;font-size:11px;line-height:1.3;color:var(--muted);font-weight:700;
}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.days + h2.sec,.past + h2.sec,.empty + h2.sec{margin-top:30px}
.chip{
  display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);font-size:14.5px;font-weight:500;
}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--dot,var(--muted))}
.chip small{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--denim);border-color:var(--denim);color:var(--denim-ink);font-weight:700}
.chip[aria-pressed="true"] small{color:inherit;opacity:.85}
.chip[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--denim-ink)}
h2.sec{
  margin:14px 0 14px;font-weight:400;font-size:26px;line-height:1.2;color:var(--denim);letter-spacing:.02em;
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
}
h2.sec small{font-family:var(--font-body);font-size:14px;color:var(--muted);letter-spacing:0}
.tag{
  display:inline-block;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;line-height:22px;
  background:var(--bg);color:var(--fg);
}
.v{--bg:var(--c-v-bg);--fg:var(--c-v-fg);--dot:var(--c-v-dot)}
.s{--bg:var(--c-s-bg);--fg:var(--c-s-fg);--dot:var(--c-s-dot)}
.z{--bg:var(--c-z-bg);--fg:var(--c-z-fg);--dot:var(--c-z-dot)}
.r{--bg:var(--c-r-bg);--fg:var(--c-r-fg);--dot:var(--c-r-dot)}
.m{--bg:var(--c-m-bg);--fg:var(--c-m-fg);--dot:var(--c-m-dot)}
.e{--bg:var(--c-e-bg);--fg:var(--c-e-fg);--dot:var(--c-e-dot)}
.l{--bg:var(--c-l-bg);--fg:var(--c-l-fg);--dot:var(--c-l-dot)}
.o{--bg:var(--c-o-bg);--fg:var(--c-o-fg);--dot:var(--c-o-dot)}
.foot{font-size:13px;color:var(--muted);line-height:1.6}

.tag.lead{--bg:var(--coral-soft);--fg:var(--coral)}
.tag.star{--bg:#fff3bf;--fg:#8a6100}
.tag.gen{--bg:var(--c-v-bg);--fg:var(--c-v-fg)}
.tag.plain{--bg:var(--surface-2);--fg:var(--muted)}
.lead-note{margin:-6px 0 0;font-size:13.5px;color:var(--muted);line-height:1.6}
.state{
  padding:26px 16px;text-align:center;color:var(--muted);font-size:14.5px;line-height:1.7;
  background:var(--surface);border:1px dashed var(--line);border-radius:16px;
}
.state button{
  margin-top:10px;min-height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface-2);cursor:pointer;font-weight:700;font-size:14px;
}
.totop{
  position:fixed;z-index:20;
  right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(18px + env(safe-area-inset-bottom,0px));
  width:52px;height:52px;border-radius:50%;padding:0;cursor:pointer;
  border:3px solid var(--surface);background:var(--denim);color:var(--denim-ink);
  display:grid;place-items:center;
  box-shadow:0 8px 14px -4px var(--shadow),0 2px 4px var(--shadow);
  opacity:0;transform:translateY(14px) scale(.9);pointer-events:none;
  transition:opacity .25s,transform .25s;
}
.totop[data-show="true"]{opacity:1;transform:none;pointer-events:auto}
.totop svg{width:22px;height:22px}
.totop:hover{transform:scale(1.06)}
@media (max-width:560px){.sheet{padding:30px 14px 22px;border-radius:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.back .sticker-slot,.back .sticker-slot::after{animation:none!important}}


.catnav{
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:8;
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  padding:8px;margin:0 -8px;border-radius:999px;
  background:var(--paper);background:color-mix(in srgb,var(--paper) 86%,transparent);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:1px solid var(--line);box-shadow:0 10px 18px -14px var(--shadow);
}
.catnav::-webkit-scrollbar{display:none}
.catnav .chip{flex:0 0 auto}
.cat{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 84px)}
.cat + .cat{margin-top:14px}
.rows{
  list-style:none;margin:0;padding:2px 14px;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
}
.work{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:13px 0;border-top:1px dashed var(--line)}
.work:first-child{border-top:0}
.yr{font-size:20px;line-height:1.3;color:var(--denim);font-variant-numeric:tabular-nums}
.yr.rep{color:transparent;user-select:none}
.ny .work{grid-template-columns:minmax(0,1fr)}
.ny .yr{display:none}
.main{display:flex;flex-direction:column;gap:6px;min-width:0}
.wt{font-weight:500;font-size:15.5px;line-height:1.5;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.lk{
  display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--denim);
  font-size:12.5px;font-weight:700;text-decoration:none;
}
.lk:hover{border-color:var(--denim)}
.lk svg{width:12px;height:12px}
.sub{margin:20px 2px 10px;font-weight:700;font-size:16px;display:flex;align-items:baseline;gap:8px}
.sub:first-of-type{margin-top:4px}
.sub small{font-weight:500;color:var(--muted);font-size:13px}
.tiles{
  list-style:none;margin:0;padding:0;display:grid;gap:8px;
  grid-template-columns:repeat(auto-fill,minmax(235px,1fr));
}
.tile{
  display:flex;flex-direction:column;gap:6px;min-width:0;padding:11px 13px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
}
.tile .tt{font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.tile .meta{font-size:12.5px}
.catnote{margin:-6px 2px 10px;font-size:13.5px;color:var(--muted);line-height:1.6;display:flex;align-items:center;gap:6px}
.stm{color:#d99a00;font-weight:700}
.tile .tt .stm{margin-right:4px}
.seg{display:flex;flex-wrap:wrap;gap:2px;margin:0 0 12px -4px}
.seg button{
  position:relative;isolation:isolate;min-height:44px;padding:0 9px;border:0;background:transparent;cursor:pointer;
  font-size:16px;color:var(--muted);
}
.seg button::before{
  content:"";position:absolute;z-index:-1;left:4px;right:4px;bottom:11px;height:11px;border-radius:6px;
  background:var(--coral-soft);transform:scaleX(0) rotate(-1.5deg);transform-origin:left center;transition:transform .25s ease;
}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{color:var(--ink);font-weight:700}
.seg button[aria-pressed="true"]::before{transform:scaleX(1) rotate(-1.5deg)}
.seg button small{font-size:12px;color:var(--muted);margin-left:3px;font-weight:500}
.panel[hidden]{display:none}
.tile .top{display:flex;align-items:flex-start;gap:8px}
.tile .top .tt{flex:1;min-width:0}
.pbtn{
  flex:0 0 auto;width:36px;height:36px;margin:-2px -4px 0 0;border-radius:50%;padding:0;cursor:pointer;
  display:grid;place-items:center;border:1.5px solid var(--denim);background:var(--surface-2);color:var(--denim);
}
.pbtn svg{width:16px;height:16px}
.pbtn:hover{background:var(--denim);color:var(--denim-ink)}
.pbtn.on{background:var(--denim);color:var(--denim-ink)}
.tile.air{border-color:var(--denim);box-shadow:0 0 0 2px var(--coral-soft)}
.work .pbtn{margin:0}
.work .wtop{display:flex;align-items:flex-start;gap:8px}
.work .wtop .wt{flex:1;min-width:0}
.perr{font-size:12.5px;color:var(--coral)}
.tile .cov{flex:0 0 auto;width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--surface-2);border:1px solid var(--line)}
.tile .alb{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}

</style>

<body>

    }).join('') + '</ul>';
  }
  var SUB_ORDER = ['SOLO', '一期生曲', 'UNIT曲', '全員曲'];
  var activeSub = {};
  function isStar(w) { return /(^|[、,，\s])(☆|★|Center)($|[、,，\s])/i.test(w.tag); }
  function tileHTML(w) {
    var tag = String(w.tag || '').split(/[、,，\s]+/).filter(function (t) { return t && !/^(☆|★|center)$/i.test(t); }).join('、');
    var tags = tagsHTML(tag) + (w.yr ? '<span class="tag plain">' + esc(w.yr) + '</span>' : '');
    var info = [];
    if (w.org) info.push(esc(w.org));
    if (w.role) info.push(esc(roleText(w.role)));
    if (w.note) info.push(esc(w.note));
    var cov = w.cov ? '<img class="cov" src="' + esc(w.cov) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">' : '';
    var alb = w.alb ? '<div class="alb">' + esc(w.alb) + '</div>' : '';
    return '<li class="tile"><div class="top">' + cov + '<div class="tt">' + (isStar(w) ? '<span class="stm" title="Center" aria-label="Center">☆</span>' : '') + esc(w.title) + alb + '</div>' + playBtn(w) + '</div>' +
      ((info.length || tags) ? '<div class="meta">' + info.join(' · ') + tags + '</div>' : '') + linksHTML(w.links) + '</li>';
  }
  function groupBy(items, keyFn) {
    var groups = [], map = {};
    items.forEach(function (w) {
      var k = keyFn(w);
      if (!map[k]) { map[k] = { k: k, items: [] }; groups.push(map[k]); }
      map[k].items.push(w);
    });
    return groups;
  }
  function tabsHTML(groups, ci, def, label, inner) {
    var cur = activeSub[ci];
    if (!groups.some(function (g) { return g.k === cur; })) {
      cur = groups.some(function (g) { return g.k === def; }) ? def : groups[0].k;
      activeSub[ci] = cur;
    }
    var seg = '<div class="seg" role="group" aria-label="' + label + '" data-ci="' + ci + '">' + groups.map(function (g) {
      return '<button type="button" data-sub="' + esc(g.k) + '" aria-pressed="' + (g.k === cur) + '">' + esc(g.k) + '</button>';
    }).join('') + '</div>';
    var panels = groups.map(function (g) {
      return '<div class="panel" data-sub="' + esc(g.k) + '"' + (g.k === cur ? '' : ' hidden') + '>' + inner(g) + '</div>';
    }).join('');
    return seg + panels;
  }
  function tilesHTML(items, ci) {
    var groups = groupBy(items, function (w) { return w.sub || '其他'; });
    groups.sort(function (a, b) {
      var ia = SUB_ORDER.indexOf(a.k), ib = SUB_ORDER.indexOf(b.k);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
    return tabsHTML(groups, ci, '全員曲', '歌曲類型', function (g) { return '<ul class="tiles">' + g.items.map(tileHTML).join('') + '</ul>'; });
  }
  function yearsHTML(items, ci) {
    var groups = groupBy(items, function (w) { return w.yr || '其他'; });
    return tabsHTML(groups, ci, '', '年份', function (g) { return rowsHTML(g.items, true); });
  }
  function render(works) {
    stopAudio();
    var cats = [], map = {};
    works.forEach(function (w) {
      if (!map[w.cat]) { map[w.cat] = []; cats.push(w.cat); }
      map[w.cat].push(w);
    });
    cats.sort(function (a, b) {
      var ia = ORDER.indexOf(a), ib = ORDER.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
    if (!cats.length) { listEl.innerHTML = '<div class="state">目前還沒有作品資料。</div>'; navEl.innerHTML = ''; navEl.hidden = true; return; }
    navEl.hidden = false;
    navEl.innerHTML = cats.map(function (c, i) {
      return '<button type="button" class="chip" data-i="' + i + '" aria-pressed="' + (i === 0) + '">' + esc(c) + '</button>';
    }).join('');
    listEl.innerHTML = cats.map(function (c, i) {
      var items = map[c];
      var tile = items.some(function (w) { return w.sub; });
      var note = items.some(isStar) ? '<p class="catnote"><span class="stm" aria-hidden="true">☆</span>為加藤史帆擔任 Center 的歌曲</p>' : '';
      if (items.some(function (w) { return w.pv; })) note += '<p class="catnote">30 秒試聽來自 iTunes，歌曲著作權屬於各權利人。</p>';
      return '<section class="cat" id="cat-' + i + '"><h2 class="sec">' + esc(c) + '</h2>' + note +
        (tile ? tilesHTML(items, i) : YEAR_TABS.indexOf(c) >= 0 ? yearsHTML(items, i) : rowsHTML(items)) + '</section>';
    }).join('');
    navBtns = [].slice.call(navEl.querySelectorAll('.chip'));
    secEls = cats.map(function (c, i) { return $('cat-' + i); });
    onScroll();
  }
  function setActive(i) {
    navBtns.forEach(function (b, j) {
      var on = j === i;
      b.setAttribute('aria-pressed', String(on));
      if (on && navEl.scrollWidth > navEl.clientWidth) {
        var left = b.offsetLeft - (navEl.clientWidth - b.offsetWidth) / 2;
        navEl.scrollLeft = left;
      }
    });
  }
  var ticking = false;
  function onScroll() {
    onScrollTop();
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      ticking = false;
      if (!secEls.length) return;
      var cur = 0;
      var atEnd = window.innerHeight + window.pageYOffset >= document.documentElement.scrollHeight - 4;
      if (atEnd) cur = secEls.length - 1;
      else secEls.forEach(function (s, i) { if (s.getBoundingClientRect().top <= 110) cur = i; });
      setActive(cur);
    });
  }
  navEl.addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    var i = +b.dataset.i;
    setActive(i);
    secEls[i].scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
  });
  listEl.addEventListener('click', function (e) {
    var pbn = e.target.closest('.pbtn');
    if (pbn) {
      if (curBtn === pbn) { stopAudio(); return; }
      au.pause(); stopUI();
      var u = pbn.dataset.play; au.src = u; curUrl = u;
      var pr = au.play();
      var mark = function () {
        if (curUrl !== u) return;
        curBtn = pbn; pbn.innerHTML = PAUSE; pbn.classList.add('on'); pbn.setAttribute('aria-label', '暫停 ' + pbn.dataset.l.replace(/^試聽 /, ''));
        var t = pbn.closest('.tile'); if (t) t.classList.add('air');
      };
      if (pr && pr.then) pr.then(mark).catch(function () { au.onerror(); }); else mark();
      return;
    }
    var b = e.target.closest('.seg button'); if (!b) return;
    var seg = b.parentNode, ci = seg.dataset.ci, sec = seg.parentNode;
    stopAudio();
    activeSub[ci] = b.dataset.sub;
    [].forEach.call(seg.querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    [].forEach.call(sec.querySelectorAll('.panel'), function (p) { p.hidden = p.dataset.sub !== b.dataset.sub; });
  });
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);

  function showError() {
    listEl.innerHTML = '<div class="state">暫時讀不到作品資料，請稍後再試。<br><button type="button" id="retry">重新載入</button></div>';
    navEl.hidden = true;
    var r = $('retry'); if (r) r.addEventListener('click', load);
  }
  function load() {
    var cached = getCache(CACHE_KEY);
    if (cached) { try { render(toWorks(parseCSV(cached))); } catch (e) {} }
    else listEl.innerHTML = '<div class="state">讀取作品中…</div>';
    fetch(CSV_URL, { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function (t) {
      var works = toWorks(parseCSV(t));
      if (!works.length) throw new Error('empty');
      setCache(CACHE_KEY, t);
      render(works);
    }).catch(function (e) {
      if (window.console) console.warn('作品資料讀取失敗', e);
      if (!cached) showError();
    });
  }
  load();
})();
</script>
</body>
</html>

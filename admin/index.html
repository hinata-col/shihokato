<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>私服穿搭後台</title>
<link rel="manifest" href="/admin.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/img/admin-icon-192.png">
<link rel="apple-touch-icon" href="/img/admin-apple-touch.png">
<meta name="theme-color" content="#344e92">
<meta name="apple-mobile-web-app-title" content="私服後台">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
:root{color-scheme:light;--ink:#1b2a4c;--muted:#566890;--denim:#2b5090;--line:#d5e0f2;--line2:#c9d6ee;--paper:#f7faff;--soft:#eef3fd;--bad:#b0364b;--ok:#2f7a43}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Huninn,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.6}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:18px 14px 60px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:24px;letter-spacing:.06em;color:var(--denim)}
.tabs{display:flex;gap:6px}
.tab{min-height:40px;padding:0 16px;border-radius:999px;border:1.6px solid var(--denim);background:#fff;color:var(--denim);font-weight:700;cursor:pointer}
.tab[aria-pressed=true]{background:var(--denim);color:#fff}
.card{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:14px}
.lbl{font-size:15px;font-weight:700;color:var(--denim)}
.lbl small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:4px}
.field{display:flex;flex-direction:column;gap:6px}
.in{width:100%;min-height:44px;padding:0 14px;border-radius:999px;border:1.6px solid var(--line2);background:#fff;font-size:14.5px}
textarea.in{border-radius:10px;padding:10px 12px;min-height:84px;resize:vertical;font-size:14px}
.hint{font-size:13px;color:var(--muted)}
.hint b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.6px solid var(--line2);background:#fff;font-size:15px;cursor:pointer}
.chip.s{min-height:36px;padding:0 12px;font-size:13.5px}
.chip[aria-pressed=true]{background:var(--denim);border-color:var(--denim);color:#fff}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:1.6px solid var(--denim);background:var(--soft);color:var(--denim);font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.main{background:var(--denim);color:#fff;min-height:50px;font-size:15.5px}
.btn.ghost{border-color:var(--line2);background:#fff;color:var(--muted);font-weight:400}
.btn:disabled{background:#dfe6f3;border-color:#dfe6f3;color:#7d8bab;cursor:not-allowed}
.drop{min-height:120px;border-radius:12px;border:2px dashed #9fb6e0;background:#f2f6fd;color:var(--denim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;text-align:center;padding:10px}
.drop.over{background:#e2ebfb}
.imgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(min-width:560px){.imgs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.im{position:relative;aspect-ratio:4/5;border-radius:8px;border:1.5px solid var(--line);background:#dfe7f6;padding:0;overflow:hidden;cursor:pointer}
.im img{display:block;width:100%;height:100%;object-fit:cover}
.im .no{position:absolute;left:5px;top:5px;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.88);font-size:12px;font-weight:700;color:#3f5a96}
.im .th{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);padding:2px 8px;border-radius:999px;background:var(--denim);color:#fff;font-size:11.5px;font-weight:700;white-space:nowrap}
.im[aria-pressed=true]{border:3px solid var(--denim)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--denim)}
.q{display:flex;flex-direction:column;gap:6px}
.qi{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;cursor:pointer;text-align:left}
.qi[aria-current=true]{border-color:var(--denim);background:var(--soft)}
.qi .c{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qi .d{font-size:13px;color:var(--muted)}
.bd{flex:0 0 auto;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#eef3fc;color:var(--muted)}
.bd.cur{background:var(--denim);color:#fff}.bd.done{background:#d6f0dc;color:#1f6a30}.bd.has{background:#fff3c4;color:#6b5200}
.msg{font-size:13.5px;padding:10px 12px;border-radius:10px;background:#fdecef;color:var(--bad)}
.msg.ok{background:#e6f5ea;color:var(--ok)}
.msg.info{background:var(--soft);color:var(--denim)}
.kv{display:flex;gap:10px;font-size:13px;border-bottom:1px dashed var(--line);padding:4px 0}
.kv span:first-child{flex:0 0 6.5em;color:var(--muted)}
.kv span:last-child{flex:1;min-width:0;word-break:break-all}
code{font-size:12.5px;background:#eef3fc;padding:8px 10px;border-radius:8px;word-break:break-all;white-space:pre-line;display:block}
.frow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.frow>span{font-size:13px;font-weight:700;color:var(--denim);min-width:3em}
.years{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.mo{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:#fff;cursor:pointer;line-height:1.25}
.mo b{font-size:14px}.mo small{font-size:11px;color:var(--muted)}
.mo:disabled{background:#f3f5f9;color:#a3aec4;cursor:default}
.mo[aria-pressed=true]{background:var(--denim);border-color:var(--denim);color:#fff}.mo[aria-pressed=true] small{color:#fff}
.polas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
@media(min-width:560px){.polas{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pola{display:block;padding:8px 8px 0;background:#fffdf7;border:0;border-radius:3px;box-shadow:0 3px 10px rgba(30,60,120,.18);text-align:left;cursor:pointer;color:#2a2a3a}
.pp{position:relative;display:block;aspect-ratio:4/5;background:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 8px,transparent 8px 16px),linear-gradient(160deg,#cfdcf5,#b9cbee);overflow:hidden}
.pp img{display:block;width:100%;height:100%;object-fit:cover}
.tg{position:absolute;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700}
.tg.src{left:6px;top:6px;background:rgba(255,255,255,.9);color:var(--denim)}.tg.src.blog{background:#fff3c4;color:#6b5200}
.tg.who{right:6px;top:6px;background:#d9e7fc;color:#2b3a67}.tg.who.k{background:#ffe1e8;color:#8a2f4c}
.tg.ss{left:6px;bottom:6px;background:rgba(255,255,255,.9);color:var(--denim)}
.tg.n{right:6px;bottom:6px;background:rgba(27,42,76,.75);color:#fff;font-weight:400}
.pc{display:flex;flex-direction:column;gap:2px;padding:8px 2px 10px}
.pc b{font-size:15px;color:var(--denim)}
.pc .cap{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .hid{align-self:flex-start;padding:1px 7px;border-radius:999px;background:#eef0f4;color:var(--muted);font-size:11px}
dialog{width:min(94vw,560px);max-width:none;max-height:92vh;padding:0;border:0;border-radius:16px;background:#fff;box-shadow:0 20px 40px -12px rgba(20,30,70,.55)}
dialog::backdrop{background:rgba(20,30,70,.5)}
.dh{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-bottom:1.5px dashed rgba(43,58,103,.25)}
.dh b{flex:1;min-width:0;color:var(--denim)}
.x{width:44px;height:44px;border:0;border-radius:50%;background:var(--soft);color:var(--denim);font-size:20px;cursor:pointer}
.db{padding:12px 14px 16px;display:flex;flex-direction:column;gap:12px}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.strip .im{flex:0 0 110px;cursor:default}
.empty{padding:24px;text-align:center;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>私服穿搭後台</h1>
    <div class="tabs">
      <button type="button" class="tab" id="tabAdd" aria-pressed="true">新增</button>
      <button type="button" class="tab" id="tabLib" aria-pressed="false">檔案庫</button>
    </div>
  </div>
  <div id="globalMsg" class="msg" hidden></div>

  <!-- 新增 -->
  <section id="viewAdd" style="display:flex;flex-direction:column;gap:14px">
    <div class="card" id="igImpCard">
      <span class="lbl">從 IG 直接匯入<small>不用 saveclip、不用選檔案</small></span>
      <span class="hint">第一次：把下面的按鈕<b>拖到 Chrome 的書籤列</b>。之後在 IG 貼文頁面（要已登入）點一下書籤，就會開新分頁回到這裡，自動放好整組圖和貼文文字，你只要確認人物、季節、縮圖再按確認。</span>
      <a class="btn" id="igBm" href="#" style="align-self:flex-start;cursor:grab" title="拖到書籤列">⭐ IG匯入</a>
    </div>

    <div class="card" id="batchCard">
      <label class="lbl" for="batch">批次模式：一次貼多個 IG 連結<small>一行一個</small></label>
      <textarea id="batch" class="in" placeholder="https://www.instagram.com/p/…&#10;https://www.instagram.com/p/…"></textarea>
      <button type="button" class="btn" id="addQueue" style="align-self:flex-start">加入待處理清單</button>
      <div class="q" id="queue" hidden></div>
    </div>

    <form class="card" id="form" autocomplete="off">
      <div id="editNote" class="msg info" hidden></div>
      <div class="field">
        <span class="lbl">來源</span>
        <div class="chips" id="srcChips"></div>
      </div>
      <div class="field" id="igBox">
        <label class="lbl" for="link">① IG 貼文連結</label>
        <input id="link" class="in" type="url" placeholder="貼上 IG 貼文連結">
        <span class="hint">貼文日期：<b id="dateText">貼上連結後自動帶入</b></span>
      </div>
      <div class="field" id="blogBox" hidden>
        <label class="lbl" for="blink">① 網友備份連結<small>選填，只存在後台，前台不顯示</small></label>
        <input id="blink" class="in" type="url" placeholder="貼上網友備份這篇部落格的連結">
        <label class="lbl" for="bdate" style="margin-top:6px">部落格日期<small>手動選</small></label>
        <input id="bdate" class="in" type="date">
      </div>
      <div class="field">
        <span class="lbl">② 人物</span>
        <div class="chips" id="whoChips"></div>
      </div>
      <div class="field">
        <span class="lbl">③ 季節<small>可以複選</small></span>
        <div class="chips" id="seasonChips"></div>
      </div>
      <div class="field">
        <span class="lbl">④ 整組圖片</span>
        <label class="drop" id="drop" for="files">
          <b>放入圖片</b>
          <span class="hint">從相簿選，或把 saveclip 下載的圖拖進來（會依檔名排序）</span>
        </label>
        <input id="files" type="file" accept="image/*" multiple hidden>
        <span class="hint" id="imgNote" hidden></span>
        <div class="imgs" id="imgs"></div>
        <button type="button" class="btn ghost" id="clearImgs" style="align-self:flex-start" hidden>重新放入整組</button>
      </div>
      <div class="field">
        <label class="lbl" for="caption">⑤ 貼文文字<small>選填，存了之後檔案庫可以搜尋</small></label>
        <textarea id="caption" class="in" placeholder="從 saveclip 複製貼文文字貼在這裡"></textarea>
      </div>
      <label class="check" for="show"><input id="show" type="checkbox" checked> 顯示在網站的私服穿搭頁</label>
      <span class="hint" id="missing" style="color:var(--bad)"></span>
      <div id="formMsg" class="msg" hidden></div>
      <button type="submit" class="btn main" id="confirm" disabled>確認：備份到 R2 並寫入試算表</button>
      <button type="button" class="btn ghost" id="cancelEdit" hidden>取消修改，改成新增</button>
    </form>

    <div class="card" id="doneCard" hidden>
      <b style="font-size:18px;color:var(--ok)">✓ 完成</b>
      <div class="field" id="doneR2"></div>
      <div class="field">
        <span class="lbl" style="font-size:13.5px">已寫入試算表「私服穿搭」分頁<span id="doneRow"></span></span>
        <div id="doneKV"></div>
      </div>
      <button type="button" class="btn main" id="next">新增下一篇</button>
    </div>
  </section>

  <!-- 檔案庫 -->
  <section id="viewLib" hidden style="flex-direction:column;gap:14px">
    <div class="field">
      <label class="lbl" for="q" style="font-size:13px">搜尋貼文文字、備註</label>
      <input id="q" class="in" type="search" placeholder="例如：ディズニー">
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div class="frow"><span>來源</span><div class="chips" id="fSrc"></div></div>
      <div class="frow"><span>人物</span><div class="chips" id="fWho"></div></div>
      <div class="frow"><span>季節</span><div class="chips" id="fSeason"></div></div>
    </div>
    <div class="card" id="cal" style="gap:10px;padding:12px">
      <div class="years" id="years"></div>
      <div class="months" id="months"></div>
      <button type="button" class="chip s" id="allYear" style="align-self:flex-start"></button>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
      <span class="lbl" style="font-size:14px" id="libHead"></span>
      <button type="button" class="btn ghost" id="reload" style="min-height:36px">重新讀取</button>
    </div>
    <div class="polas" id="polas"></div>
    <p class="empty" id="libEmpty" hidden>沒有符合的貼文</p>
  </section>
</div>

<dialog id="dlg">
  <div class="dh"><b id="dTitle"></b><button type="button" class="x" id="dClose" aria-label="關閉">×</button></div>
  <div class="db">
    <div class="strip" id="dImgs"></div>
    <div style="display:flex;flex-direction:column;gap:4px;font-size:13.5px" id="dInfo"></div>
    <div class="chips" id="dBtns"></div>
    <div id="dMsg" class="msg" hidden></div>
  </div>
</dialog>

<script>
(function () {
  'use strict';
  var R2 = 'https://pub-ce81db85078f428e84825b9267b26b5c.r2.dev/';
  var API = '/admin/api/';
  var SEASONS = ['春', '夏', '秋', '冬'];
  var PEOPLE = ['加藤史帆', '佐々木久美'];
  var A64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pad(n) { return ('0' + n).slice(-2); }
  function igCode(u) { var m = /instagram\.com\/(?:[\w.]+\/)?(?:p|reel|reels|tv)\/([\w-]+)/i.exec(u || ''); return m ? m[1] : ''; }
  function igDate(c) {
    try {
      var n = BigInt(0);
      for (var i = 0; i < c.length; i++) { var k = A64.indexOf(c[i]); if (k < 0) return null; n = n * BigInt(64) + BigInt(k); }
      var d = new Date(Number((n >> BigInt(23)) + BigInt('1314220021721')) + 8 * 3600e3), y = d.getUTCFullYear();
      if (!(y >= 2012 && y <= 2100)) return null;
      return { y: y, m: d.getUTCMonth() + 1, s: y + '.' + pad(d.getUTCMonth() + 1) + '.' + pad(d.getUTCDate()) };
    } catch (e) { return null; }
  }
  function parseDate(s) {
    var m = /(\d{4})\D+(\d{1,2})\D+(\d{1,2})/.exec(String(s || ''));
    return m ? { y: +m[1], m: +m[2], s: m[1] + '.' + pad(m[2]) + '.' + pad(m[3]) } : null;
  }
  function folderOf(who) { return who === '佐々木久美' ? 'kumi' : 'kato'; }
  function sortSeasons(a) { return a.slice().sort(function (x, y) { return SEASONS.indexOf(x) - SEASONS.indexOf(y); }); }
  function showMsg(el, text, kind) { el.className = 'msg' + (kind ? ' ' + kind : ''); el.textContent = text; el.hidden = !text; }

  async function api(path, opt) {
    var r = await fetch(API + path, opt);
    var j = null;
    try { j = await r.json(); } catch (e) {}
    if (!r.ok || !j || j.ok === false) throw new Error((j && j.error) || ('伺服器錯誤 ' + r.status));
    return j;
  }

  /* ---------- 試算表資料 ---------- */
  var items = [], loaded = false;
  var COLS = { who: /^人物/, date: /^日期/, link: /^IG|^連結/, seasons: /^季節/, note: /^備註/, thumb: /^縮圖/, src: /^來源/, caption: /^貼文文字/, n: /^張數/, folder: /^備份資料夾/, blink: /^備份來源/, show: /^顯示/ };
  async function loadRows() {
    var j = await api('sheet');
    var h = j.header.map(function (x) { return String(x).trim(); }), ci = {};
    Object.keys(COLS).forEach(function (k) { ci[k] = h.findIndex(function (x) { return COLS[k].test(x); }); });
    var g = function (r, k) { return ci[k] >= 0 ? String(r[ci[k]] || '').trim() : ''; };
    items = [];
    j.rows.forEach(function (r, i) {
      if (!r.some(function (x) { return String(x).trim(); })) return;
      var link = g(r, 'link'), code = igCode(link), src = /部落格|blog/i.test(g(r, 'src')) ? 'blog' : 'ig';
      var d = parseDate(g(r, 'date')) || (code ? igDate(code) : null);
      items.push({
        row: i + 2, src: src, who: /久美/.test(g(r, 'who')) ? '佐々木久美' : '加藤史帆',
        link: link, code: code, date: d, seasons: g(r, 'seasons'), note: g(r, 'note'), thumb: g(r, 'thumb'),
        caption: g(r, 'caption'), n: parseInt(g(r, 'n'), 10) || 0, folder: g(r, 'folder'), blink: g(r, 'blink'),
        show: /✓|v|true|y|是|顯示/i.test(g(r, 'show'))
      });
    });
    loaded = true;
  }
  function findByCode(c) { return items.filter(function (x) { return x.code === c; })[0]; }

  /* ---------- 新增／修改表單 ---------- */
  var F = blankForm();
  function blankForm(src) {
    return { src: src || 'ig', who: F ? F.who : '加藤史帆', seasons: [], files: [], thumb: 0, editRow: 0, edit: null, replace: false };
  }
  var queue = [], cur = -1;

  function chip(label, on, cls) { return '<button type="button" class="chip' + (cls ? ' ' + cls : '') + '" aria-pressed="' + on + '" data-v="' + esc(label) + '">' + esc(label) + '</button>'; }
  function renderChips() {
    $('srcChips').innerHTML = chip('IG', F.src === 'ig') + chip('部落格', F.src === 'blog');
    $('whoChips').innerHTML = PEOPLE.map(function (p) { return chip(p, F.who === p); }).join('');
    $('seasonChips').innerHTML = SEASONS.map(function (s) { return chip(s, F.seasons.indexOf(s) >= 0); }).join('');
    $('igBox').hidden = F.src !== 'ig';
    $('blogBox').hidden = F.src !== 'blog';
  }
  function curDate() {
    if (F.src === 'blog') { var v = $('bdate').value; return v ? parseDate(v) : null; }
    var c = igCode($('link').value); return c ? igDate(c) : null;
  }
  function existingImgs() {
    if (!F.edit || !F.edit.folder || !F.edit.n || F.replace) return [];
    var out = [];
    for (var i = 1; i <= F.edit.n; i++) out.push(R2 + F.edit.folder + pad(i) + '.jpg');
    return out;
  }
  function renderImgs() {
    var ex = existingImgs(), urls = F.files.length ? F.files.map(function (f) { return f.url; }) : ex;
    $('drop').hidden = urls.length > 0;
    $('clearImgs').hidden = !urls.length;
    $('imgNote').hidden = !urls.length;
    $('imgNote').textContent = F.files.length

    renderLib();
  }
  $('tabAdd').addEventListener('click', function () { switchTab('add'); });
  $('tabLib').addEventListener('click', function () { openLib(false); });

  /* ---------- 從 IG 匯入（書籤小工具） ---------- */
  var BM = "(async()=>{const m=location.pathname.match(/\\/(?:p|reel|reels|tv)\\/([\\w-]+)/);if(!/instagram\\.com$/.test(location.hostname)||!m){alert('請在 IG 貼文頁面使用（網址要有 /p/ 或 /reel/）');return}"
    + "const w=window.open('about:blank','_blank');"
    + "try{const A='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';let n=0n;for(const c of m[1])n=n*64n+BigInt(A.indexOf(c));"
    + "const r=await fetch('/api/v1/media/'+n+'/info/',{headers:{'X-IG-App-ID':'936619743392459'},credentials:'include'});const it=(await r.json()).items[0];const ms=it.carousel_media||[it];"
    + "const d={code:m[1],t:it.taken_at,c:(it.caption&&it.caption.text)||'',u:it.user.username,m:ms.map(x=>({v:!!x.video_versions,i:x.image_versions2.candidates[0].url}))};"
    + "const u='https://shihokato.pages.dev/admin/#igimport='+encodeURIComponent(JSON.stringify(d));if(w)w.location.href=u;else location.href=u}"
    + "catch(e){if(w)w.close();alert('抓不到這篇貼文的資料：'+e.message+'（確認 IG 有登入）')}})()";
  $('igBm').href = 'javascript:' + encodeURIComponent(BM);
  $('igBm').addEventListener('click', function (e) { e.preventDefault(); showMsg($('globalMsg'), '這個按鈕要拖到書籤列，在 IG 貼文頁面點才有作用。', 'info'); });

  async function importFromIG() {
    var m = /^#igimport=([\s\S]+)$/.exec(location.hash);
    if (!m) return;
    history.replaceState(null, '', location.pathname + location.search);
    var msg = $('formMsg'), d;
    try { d = JSON.parse(decodeURIComponent(m[1])); } catch (e) { showMsg($('globalMsg'), 'IG 匯入資料讀不出來，請回 IG 再點一次書籤。'); return; }
    switchTab('add'); cur = -1; resetForm('ig'); renderQueue();
    if (!loaded) { try { await loadRows(); } catch (e) {} }
    $('link').value = 'https://www.instagram.com/p/' + d.code + '/';
    $('link').dispatchEvent(new Event('input'));
    if (!F.edit) {
      F.who = /kumi|sasaki/i.test(d.u || '') ? '佐々木久美' : '加藤史帆';
      var mo = new Date((d.t + 9 * 3600) * 1000).getUTCMonth() + 1;
      F.seasons = [mo >= 3 && mo <= 5 ? '春' : mo >= 6 && mo <= 8 ? '夏' : mo >= 9 && mo <= 11 ? '秋' : '冬'];
    }
    if (!$('caption').value.trim()) $('caption').value = (d.c || '').trim();
    renderForm();
    var files = [];
    try {
      for (var i = 0; i < d.m.length; i++) {
        showMsg(msg, '從 IG 抓圖中… ' + (i + 1) + ' / ' + d.m.length, 'info');
        var r = await fetch('/admin/api/igimg?u=' + encodeURIComponent(d.m[i].i));
        if (!r.ok) throw new Error('第 ' + (i + 1) + ' 張抓不到（' + r.status + '）');
        files.push(new File([await r.blob()], d.code + '_' + pad(i + 1) + '.jpg', { type: 'image/jpeg' }));
      }
    } catch (err) { showMsg(msg, err.message + '，IG 的圖片網址可能過期了，請回 IG 頁面重新點一次書籤。'); return; }
    addFiles(files);
    var ti = d.m.findIndex(function (x) { return !x.v; }); F.thumb = ti < 0 ? 0 : ti;
    renderForm();
    var vids = d.m.filter(function (x) { return x.v; }).length;
    showMsg(msg, '已從 IG 匯入 ' + files.length + ' 張' + (vids ? '（其中 ' + vids + ' 張是影片封面）' : '') + '，縮圖先選第一張照片。確認人物、季節、縮圖後按確認。', 'info');
  }

  resetForm('ig');
  loadRows().then(renderQueue).catch(function (err) { showMsg($('globalMsg'), '讀取試算表失敗：' + err.message); });
  importFromIG();
  window.addEventListener('hashchange', importFromIG);
})();
</script>
</body>
</html>

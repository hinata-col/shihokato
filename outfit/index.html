}

      g.fillStyle = pe.acc; g.fillRect(6, 6, lw, lh);
      g.fillStyle = pe.ink; g.fillRect(0, 0, lw, lh);
      g.fillStyle = '#fff'; g.fillText(it.w || '加藤史帆', 34, 72);
      g.restore();
      /* hashtag */
      g.fillStyle = pe.ink; g.textAlign = 'right'; g.font = '500 30px ' + SERIF; g.textBaseline = 'alphabetic';
      g.fillText(pe.card, W - 76, H - 72 - 45 + 24); g.fillText(it.ig ? pe.ig : pe.blog, W - 76, H - 72 + 24);
      /* 星星 */
      glyph(g, SH, 850, 640, 64, pe.ink, 10); glyph(g, SPARK, 900, 820, 44, '#fff'); glyph(g, SH, 830, 980, 40, pe.acc, -12);
      glyph(g, SPARK, 80, 60, 36, pe.acc); glyph(g, SH, 520, 1190, 34, pe.acc, 6); glyph(g, SPARK, 560, 1250, 26, pe.ink);
      return new Promise(function (ok, no) { c.toBlob(function (bl) { bl ? ok(bl) : no(new Error('blob')); }, 'image/jpeg', 0.92); });
    });
  }
  function cardFile(it) { return makeCard(it).then(function (bl) { return new File([bl], 'shihokato-outfit.jpg', { type: 'image/jpeg' }); }); }
  /* 分享預覽：先看圖卡與文案，再下載或分享 */
  var shBlob = null, shFile = null, shUrl = '', shSeq = 0;
  function flash(btn, msg, back) { btn.textContent = msg; setTimeout(function () { btn.textContent = back; }, 1800); }
  function showMain() {
    $('shP').hidden = true; $('igF').hidden = false; $('igMain').hidden = false;
    if (shUrl) { URL.revokeObjectURL(shUrl); shUrl = ''; } shBlob = shFile = null; shSeq++;
  }
  function showPreview() {
    if (!cur) return;
    var it = cur, my = ++shSeq;
    $('igF').hidden = true; $('igMain').hidden = true; $('shP').hidden = false;
    $('shTxt').textContent = shareText(it);
    var hasCard = isR2(it.img);
    $('shDl').hidden = !hasCard; $('shImg').hidden = true; $('shNote').hidden = false;
    $('shNote').textContent = hasCard ? '圖卡製作中…' : '這則還沒有 R2 縮圖，沒辦法製作圖卡，只能分享文案。';
    if (!hasCard) return;
    makeCard(it).then(function (bl) {
      if (my !== shSeq) return;
      shBlob = bl; shFile = new File([bl], 'shihokato-outfit.jpg', { type: 'image/jpeg' });
      shUrl = URL.createObjectURL(bl); $('shImg').src = shUrl; $('shImg').hidden = false; $('shNote').hidden = true;
    }).catch(function () { if (my === shSeq) { $('shNote').textContent = '圖卡做不出來（可能是 R2 的 CORS 還沒設好），仍然可以分享文案。'; $('shDl').hidden = true; } });
  }
  $('igS').addEventListener('click', showPreview);
  $('shBack').addEventListener('click', function () { if (shareMode) closeIG(); else showMain(); });
  $('shDl').addEventListener('click', function () {
    if (!shBlob) return;
    var a = document.createElement('a'), u = URL.createObjectURL(shBlob); a.href = u; a.download = 'shihokato-outfit.jpg';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
    flash($('shDl'), '已下載', '下載圖卡');
  });
  function copyText(btn, back) {
    var t = $('shTxt').textContent;
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { flash(btn, '已複製', back); }, function () { flash(btn, '請長按文字複製', back); });
    else flash(btn, '請長按文字複製', back);
  }
  $('shCp').addEventListener('click', function () { copyText($('shCp'), '複製文案'); });
  $('shGo').addEventListener('click', function () {
    var text = $('shTxt').textContent, btn = $('shGo');
    if (shFile && navigator.canShare && navigator.canShare({ files: [shFile] })) { navigator.share({ files: [shFile], text: text }).catch(function () {}); return; }
    if (navigator.share) { navigator.share({ text: text }).catch(function () {}); return; }
    copyText(btn, '分享');
  });
  $('igX').addEventListener('click', closeIG);
  dlg.addEventListener('click', function (e) { if (e.target === dlg) closeIG(); });
  dlg.addEventListener('close', function () { $('igF').innerHTML = ''; });
  listEl.addEventListener('click', function (e) { var b = e.target.closest('button.pola'); if (b) openIG(shown[+b.dataset.i]); });

  /* 隨機今日穿搭（扭蛋） */
  var gcDlg = $('gcDlg'), gcIdle = $('gcIdle'), gcRes = $('gcRes'), gcMsg = $('gcMsg'), gcCur = null;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function gcShow(res) { gcIdle.hidden = res; gcRes.hidden = !res; }
  function gcOpen() {
    gcShow(false); gcMsg.textContent = ''; gcCur = null;
    if (gcDlg.showModal) gcDlg.showModal(); else gcDlg.setAttribute('open', '');
    $('gcCityBox').hidden = !!gcBucket; $('gcCity').setAttribute('aria-expanded', String(!gcBucket));
    if (!gcBucket) wxMsg.textContent = '先選一個城市，才知道今天適合穿什麼季節。';
  }
  function gcClose() { if (gcDlg.close) gcDlg.close(); else gcDlg.removeAttribute('open'); }
  function gcPool() {
    return items.filter(function (it) { return it.img && (!gcWho || it.w === gcWho) && it.ss.some(function (s) { return gcBucket.indexOf(s) >= 0; }); });
  }
  function gcDraw() {
    if (!gcBucket) { $('gcCityBox').hidden = false; $('gcCity').setAttribute('aria-expanded', 'true'); wxMsg.textContent = '先選一個城市，才知道今天適合穿什麼季節。'; return; }
    var pool = gcPool();
    if (!pool.length) { gcShow(false); gcMsg.textContent = '「' + gcBucket.join('・') + '」' + (gcWho ? '、' + gcWho : '') + '還沒有穿搭可以抽，換個人物試試。'; return; }
    gcMsg.textContent = '';
    var cand = pool.length > 1 ? pool.filter(function (x) { return items.indexOf(x) !== gcLast; }) : pool;
    var it = cand[Math.floor(Math.random() * cand.length)];
    gcLast = items.indexOf(it); gcCur = it;
    var go = function () {
      $('gcPic').innerHTML = '<img src="' + esc(it.img) + '" alt="" referrerpolicy="no-referrer">';
      $('gcName').textContent = it.w;
      $('gcShare').hidden = !isR2(it.img);
      $('gcSrc').hidden = !it.ig; if (it.ig) $('gcSrc').href = it.u;
      gcShow(true); $('gcDlg').scrollTop = 0; $('gcAgain').focus();
      $('gcGo').disabled = false;
    };
    if (reduce) { go(); return; }
    var m = $('gcMach'); $('gcGo').disabled = true; m.classList.remove('shake'); void m.offsetWidth; m.classList.add('shake');
    setTimeout(function () { m.classList.remove('shake'); go(); }, 950);
  }
  $('gcOpen').addEventListener('click', gcOpen);
  $('gcX').addEventListener('click', gcClose);
  gcDlg.addEventListener('click', function (e) { if (e.target === gcDlg) gcClose(); });
  $('gcCity').addEventListener('click', function () { var h = $('gcCityBox').hidden; $('gcCityBox').hidden = !h; this.setAttribute('aria-expanded', String(h)); });
  $('gcGo').addEventListener('click', gcDraw);
  $('gcAgain').addEventListener('click', function () { gcShow(false); gcDraw(); });
  $('gcPpl').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    gcWho = b.getAttribute('data-g');
    Array.prototype.forEach.call($('gcPpl').querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
  });
  $('gcShare').addEventListener('click', function () { if (!gcCur) return; var it = gcCur; gcClose(); openIG(it, true); });

  function load() {
    var cached = getCache(CACHE_KEY);
    if (cached) { try { items = toItems(parseCSV(cached)); renderList(); } catch (e) {} }
    else listEl.innerHTML = '<div class="state">讀取內容中…</div>';
    fetch(CSV_URL, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (t) { setCache(CACHE_KEY, t); items = toItems(parseCSV(t)); renderList(); })
      .catch(function (e) { if (window.console) console.warn('私服穿搭資料讀取失敗', e); if (!cached) listEl.innerHTML = '<div class="state">暫時讀不到內容，請稍後再試。<br><button type="button" id="retry">重新載入</button></div>'; var r = $('retry'); if (r) r.addEventListener('click', load); });
  }
  window.addEventListener('scroll', onScrollTop, { passive: true });
  onScrollTop();
  load();
})();
</script>

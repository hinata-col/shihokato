:root{
  --font-hand:"Handnote","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;

  --desk-1:#dbe9fb; --desk-2:#b4cef1;
  --paper:#f7faff; --paper-dot:#cfdcf2;
  --ink:#1b2a4c; --muted:#566890;
  --denim:#2b5090; --denim-ink:#ffffff;
  --coral:#d9435a; --coral-soft:#ffe1e5;
  --line:#d5e0f2; --surface:#ffffff; --surface-2:#eef3fc;
  --tape:rgba(238,90,109,.30); --tape-2:rgba(255,255,255,.55);
  --shadow:rgba(30,60,120,.22);

  --c-v-bg:#dbe6ff; --c-v-fg:#23409e; --c-v-dot:#3b5bdb;
  --c-s-bg:#ecdcf7; --c-s-fg:#6b1f87; --c-s-dot:#9c36b5;
  --c-z-bg:#ffe3d1; --c-z-fg:#9a3d06; --c-z-dot:#e8590c;
  --c-r-bg:#cdeff3; --c-r-fg:#0a5560; --c-r-dot:#0b7285;
  --c-m-bg:#fbdbe7; --c-m-fg:#94163f; --c-m-dot:#c2255c;
  --c-e-bg:#d6f0dc; --c-e-fg:#1f6a30; --c-e-dot:#2f9e44;
  --c-l-bg:#ffd9d9; --c-l-fg:#a82121; --c-l-dot:#e03131;
  --c-o-bg:#e2e7f0; --c-o-fg:#46546e; --c-o-dot:#7b8aa5;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:linear-gradient(180deg,var(--desk-1),var(--desk-2)) var(--desk-2);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--font-body);font-size:16px;line-height:1.6;
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100%;
}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:6px}

.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{
  display:inline-flex;align-items:center;gap:10px;min-height:56px;text-decoration:none;font-size:15px;cursor:pointer;
}
.back .sticker-slot{
  position:relative;overflow:hidden;width:60px;height:60px;border-radius:15px;font-size:10px;
  animation:nudge 4.8s ease-in-out infinite;transition:transform .2s;
}
.back .sticker-slot::after{
  content:"";position:absolute;inset:0;transform:translateX(-130%);
  background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.8) 50%,transparent 65%);
  animation:shine 4.8s ease-in-out infinite;
}
.back:hover .sticker-slot,.back:focus-visible .sticker-slot{animation:none;transform:rotate(4deg) scale(1.1)}
@keyframes nudge{
  0%,68%,100%{transform:rotate(-5deg) translateY(0)}
  76%{transform:rotate(-11deg) translateY(-4px)}
  84%{transform:rotate(2deg) translateY(-4px)}
  92%{transform:rotate(-7deg) translateY(0)}
}
@keyframes shine{0%,70%{transform:translateX(-130%)}92%,100%{transform:translateX(130%)}}

/* 點點紙 */
.sheet{
  position:relative;
  background:
    radial-gradient(circle,var(--paper-dot) 1.1px,transparent 1.3px) 0 0/22px 22px,
    var(--paper);
  border-radius:20px;
  padding:34px 26px 28px;
  box-shadow:0 22px 40px -22px var(--shadow),0 2px 0 var(--line) inset;
  display:flex;flex-direction:column;gap:18px;
}
.sheet::before,.sheet::after{
  content:"";position:absolute;top:-10px;width:92px;height:26px;
  background:repeating-linear-gradient(90deg,var(--tape-2) 0 7px,transparent 7px 14px),var(--tape);
  box-shadow:0 2px 4px -1px var(--shadow);
}
.sheet::before{left:26px;transform:rotate(-4deg)}
.sheet::after{right:26px;transform:rotate(3deg)}

.head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{
  margin:0;font-family:var(--font-hand);font-weight:400;
  font-size:clamp(44px,9vw,60px);line-height:1;letter-spacing:.04em;color:var(--denim);
}
.sticker-slot{
  width:68px;height:68px;border-radius:16px;transform:rotate(-5deg);
  background:repeating-linear-gradient(135deg,var(--surface-2) 0 8px,var(--line) 8px 16px);
  border:3px solid var(--surface);box-shadow:0 8px 14px -8px var(--shadow);
  display:grid;place-items:center;text-align:center;font-size:11px;line-height:1.3;color:var(--muted);font-weight:700;
}
.tznote{display:flex;align-items:center;gap:7px;margin:-8px 0 0;font-size:13.5px;color:var(--muted);line-height:1.5}
.tznote svg{flex:0 0 auto;width:15px;height:15px}

.controls{display:flex;flex-direction:column;gap:12px}
.seg{display:flex;gap:6px;margin-left:auto;align-self:flex-end}
.seg button{
  position:relative;isolation:isolate;min-height:44px;padding:0 12px;border:0;background:transparent;cursor:pointer;
  font-size:17px;color:var(--muted);
}
.seg button::before{
  content:"";position:absolute;z-index:-1;left:4px;right:4px;bottom:11px;height:11px;border-radius:6px;
  background:var(--coral-soft);transform:scaleX(0) rotate(-1.5deg);transform-origin:left center;transition:transform .25s ease;
}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{color:var(--ink);font-weight:700}
.seg button[aria-pressed="true"]::before{transform:scaleX(1) rotate(-1.5deg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.days + h2.sec,.past + h2.sec,.empty + h2.sec{margin-top:30px}
.chip{
  display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);font-size:14.5px;font-weight:500;
}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--dot,var(--muted))}
.chip small{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--denim);border-color:var(--denim);color:var(--denim-ink);font-weight:700}
.chip[aria-pressed="true"] small{color:inherit;opacity:.85}
.chip[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--denim-ink)}

h2.sec{
  margin:14px 0 14px;font-weight:400;font-size:26px;line-height:1.2;color:var(--denim);letter-spacing:.02em;
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
}
h2.sec small{font-family:var(--font-body);font-size:14px;color:var(--muted);letter-spacing:0}

/* 日期分組 */
.days{display:flex;flex-direction:column;gap:10px}
.day{
  display:grid;grid-template-columns:104px minmax(0,1fr);gap:6px 14px;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 14px 12px;
}
.date{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.date .md{font-size:30px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.date .wk{font-size:13px;color:var(--muted);font-weight:500}
.rel{
  display:inline-block;padding:1px 10px;border-radius:999px;background:var(--coral);color:#fff;
  font-size:12.5px;font-weight:700;
}
.day.is-today{border-color:var(--coral);box-shadow:0 0 0 2px var(--coral-soft)}
.evs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;min-width:0}
.ev{border-top:1px dashed var(--line)}
.ev:first-child{border-top:0}
.evrow{
  display:grid;grid-template-columns:82px minmax(0,1fr) 22px;gap:12px;align-items:start;
  padding:10px 4px;text-decoration:none;border-radius:10px;
}
a.evrow:hover{background:var(--surface-2)}
.time{display:flex;flex-direction:column;line-height:1.25;font-variant-numeric:tabular-nums}
.time .t1{font-weight:700;font-size:16px}
.time .t2{font-size:12.5px;color:var(--muted)}
.time em{font-style:normal;background:var(--surface-2);border-radius:4px;padding:0 4px;margin-left:2px}
.allday{
  align-self:flex-start;padding:2px 10px;border-radius:8px;border:1.5px dashed var(--denim);
  color:var(--denim);font-size:13px;font-weight:700;
}
.adwrap{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.range{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.main{display:flex;flex-direction:column;gap:6px;min-width:0}
.title{font-weight:500;font-size:15.5px;line-height:1.5;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{
  display:inline-block;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;line-height:22px;
  background:var(--bg);color:var(--fg);
}
.note{font-size:12.5px;color:var(--muted)}
.go{width:18px;height:18px;margin-top:4px;color:var(--muted)}
a.evrow:hover .go{color:var(--denim)}

.v{--bg:var(--c-v-bg);--fg:var(--c-v-fg);--dot:var(--c-v-dot)}
.s{--bg:var(--c-s-bg);--fg:var(--c-s-fg);--dot:var(--c-s-dot)}
.z{--bg:var(--c-z-bg);--fg:var(--c-z-fg);--dot:var(--c-z-dot)}
.r{--bg:var(--c-r-bg);--fg:var(--c-r-fg);--dot:var(--c-r-dot)}
.m{--bg:var(--c-m-bg);--fg:var(--c-m-fg);--dot:var(--c-m-dot)}
.e{--bg:var(--c-e-bg);--fg:var(--c-e-fg);--dot:var(--c-e-dot)}
.l{--bg:var(--c-l-bg);--fg:var(--c-l-fg);--dot:var(--c-l-dot)}
.o{--bg:var(--c-o-bg);--fg:var(--c-o-fg);--dot:var(--c-o-dot)}

.empty{
  padding:22px 16px;text-align:center;color:var(--muted);font-size:14.5px;
  background:var(--surface);border:1px dashed var(--line);border-radius:16px;
}

/* 過去的行程 */
.past{display:flex;flex-direction:column;gap:8px}
details.pm{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.pm summary{
  display:flex;align-items:center;gap:10px;min-height:48px;padding:0 16px;cursor:pointer;list-style:none;font-weight:700;
}
details.pm summary::-webkit-details-marker{display:none}
details.pm summary::before{
  content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
  transform:rotate(-45deg);transition:transform .2s;
}
details.pm[open] summary::before{transform:rotate(45deg)}
details.pm summary small{margin-left:auto;font-weight:500;color:var(--muted);font-size:13px}
details.pm .days{padding:0 10px 12px}
details.pm .day{background:var(--surface-2)}

/* 月曆 */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.calhead .ym{white-space:nowrap;font-size:24px;line-height:1;color:var(--denim);font-variant-numeric:tabular-nums}
.navb{
  width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;display:grid;place-items:center;
}
.navb:disabled{opacity:.35;cursor:default}
.navb svg{width:18px;height:18px}
.tobtn{white-space:nowrap;margin-left:auto;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:700;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{text-align:center;font-size:12.5px;color:var(--muted);font-weight:700;padding:4px 0}
.wd:first-child{color:var(--coral)}
.cell{
  position:relative;min-height:58px;border-radius:12px;border:1px solid transparent;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;padding:6px 2px 4px;
}
.cell.blank{cursor:default}
.cell .n{font-weight:500;font-size:14.5px;font-variant-numeric:tabular-nums;line-height:1}
.cell:not(.blank):hover{background:var(--surface-2)}
.cell.has .n{font-weight:700}
.cell.today .n{background:var(--coral);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;margin-top:-4px}
.cell.sel{border-color:var(--denim);background:var(--surface-2)}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:44px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--dot)}
.dots b{font-size:10.5px;line-height:7px;color:var(--muted);font-weight:700}
.dayhead{margin:16px 2px 8px;font-weight:700;font-size:16px}
.dayhead small{font-weight:500;color:var(--muted);margin-left:8px}
.panel .evs{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 12px}

.foot{font-size:13px;color:var(--muted);line-height:1.6}

.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:var(--denim);color:var(--denim-ink);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:20;max-width:calc(100vw - 32px);text-align:center;
}
.toast[data-show="true"]{opacity:1;transform:translate(-50%,0)}

@media (max-width:560px){
  .sheet{padding:30px 14px 22px;border-radius:18px}
  .day{grid-template-columns:minmax(0,1fr);padding:12px}
  .date{flex-direction:row;align-items:baseline;gap:8px;flex-wrap:wrap}
  .date .md{font-size:26px}
  .evrow{grid-template-columns:70px minmax(0,1fr) 18px;gap:10px}
  .cell{min-height:50px}
  .cal{padding:10px}
  .calhead{gap:6px}
  .calhead .ym{font-size:21px}
  .navb{width:40px;height:40px}
  .tobtn{padding:0 12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.seg button::before{transition:none}.back .sticker-slot,.back .sticker-slot::after{animation:none!important}}

  /* ===== 直接讀試算表 =====
     把試算表「檔案 > 共用 > 發布到網路」得到的 CSV 連結貼在下面。
     留空，或讀取失敗時，會顯示上面內建的資料快照。 */
  var SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTwvy-Oyq413ORq1Lxo22qGb6VnLp-1Zi2UyfDgIuwAsneVJh0XHZhwm5xagSJ7QGkxFHpHrsN4LKoD/pub?gid=0&single=true&output=csv';

  function parseCSV(t) {
    var rows = [], row = [], f = '', q = false;
    for (var i = 0; i < t.length; i++) {
      var c = t[i];
      if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(f); f = ''; rows.push(row); row = []; }
      else f += c;
    }
    if (f !== '' || row.length) { row.push(f); rows.push(row); }
    return rows;
  }
  function normDate(v) {
    var m = /^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/.exec(String(v || '').trim());
    return m ? m[1] + '/' + (+m[2]) + '/' + (+m[3]) : '';
  }
  function normTime(v) {
    var str = String(v || ''), m = /(\d{1,2}):(\d{2})/.exec(str);
    if (!m) return '';
    var h = +m[1];
    if (/下午|PM/i.test(str) && h < 12) h += 12;
    if (/上午|AM/i.test(str) && h === 12) h = 0;
    return h + ':' + m[2];
  }
  function rowsFromCSV(text) {
    var table = parseCSV(text);
    if (!table.length) return [];
    var head = table[0].map(function (h) { return h.trim(); });
    function col(re) { for (var i = 0; i < head.length; i++) if (re.test(head[i])) return i; return -1; }
    var ix = { d: col(/^日期/), s: col(/^時間.*開始/), e: col(/^時間.*結束/), t: col(/^名稱/), n: col(/^資訊/), id: col(/^Event ?ID/i), c: col(/^分類/), ed: col(/^結束日期/) };
    if (ix.d < 0 || ix.t < 0) return [];
    var byName = {}; CATS.forEach(function (c) { byName[c[1]] = c[0]; });
    var seen = {}, out = [];
    table.slice(1).forEach(function (r) {
      function g(i) { return i >= 0 && r[i] != null ? String(r[i]).trim() : ''; }
      var date = normDate(g(ix.d)), title = g(ix.t);
      if (!date || !title) return;
      var id = g(ix.id);
      if (id) { if (seen[id]) return; seen[id] = 1; }
      out.push([date, normTime(g(ix.s)), normTime(g(ix.e)), title, g(ix.n), byName[g(ix.c)] || 'o', normDate(g(ix.ed))]);
    });
    return out;
  }
  function loadLive() {
    if (!SHEET_CSV_URL && !window.__CSV_TEXT__) return;
    var get = window.__CSV_TEXT__ ? Promise.resolve(window.__CSV_TEXT__)
      : fetch(SHEET_CSV_URL, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); });
    get.then(function (t) {
      var rows = rowsFromCSV(t);
      if (!rows.length) throw new Error('沒有讀到任何行程');
      EVENTS = buildEvents(rows); setRange(); render();
    }).catch(function (e) { console.warn('讀取試算表失敗，改用內建資料：', e); });
  }
  render();
  loadLive();
})();
</script>

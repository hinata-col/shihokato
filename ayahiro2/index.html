<script>
(function () {
  'use strict';
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTwvy-Oyq413ORq1Lxo22qGb6VnLp-1Zi2UyfDgIuwAsneVJh0XHZhwm5xagSJ7QGkxFHpHrsN4LKoD/pub?gid=332539515&single=true&output=csv';
  var CACHE_KEY = 'shk-ayahiro2-csv-v1';
  var BLOCKS = ['精選連結', 'S2片頭曲／片尾曲中字版', '訪談報導', 'S2業績報告', '彩弘花絮中字版'];

  var $ = function (id) { return document.getElementById(id); };

  }
  function idx(h, re) { for (var i = 0; i < h.length; i++) if (re.test(h[i])) return i; return -1; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  var MEDAL = '<svg class="medal" viewBox="0 0 44 44" aria-hidden="true"><path d="M13 3h8l3 12h-8zM31 3h-8l-3 12h8z" fill="#ff9db0" stroke="#2b3a67" stroke-width="2" stroke-linejoin="round"/><circle cx="22" cy="27" r="13" fill="#ffe27a" stroke="#2b3a67" stroke-width="2.2"/><path d="M22 19.5l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5-3.7-3.4 5-.6z" fill="#fff" stroke="#2b3a67" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  function normDate(s) {
    var m = /(\d{4})\D+(\d{1,2})\D+(\d{1,2})/.exec(String(s || ''));
    return m ? { y: +m[1], m: +m[2], d: +m[3], key: m[1] + '/' + ('0' + m[2]).slice(-2) + '/' + ('0' + m[3]).slice(-2) } : null;
  }
  function toItems(rows) {
    if (!rows.length) return [];
    var h = rows[0].map(function (s) { return String(s || '').trim(); });
    var ci = { b: idx(h, /^區塊/), d: idx(h, /^日期/), t: idx(h, /^標題/), u: idx(h, /^連結/), p: idx(h, /^縮圖/), a: idx(h, /^自動縮圖/) };
    var out = [];
    rows.slice(1).forEach(function (r) {
      function g(i) { return i >= 0 && r[i] != null ? String(r[i]).trim() : ''; }
      var u = safeUrl(g(ci.u)), t = g(ci.t);
      if (!u || !t) return;
      out.push({ b: g(ci.b), d: normDate(g(ci.d)), t: t, u: u, img: (safeUrl(g(ci.p)) || safeUrl(g(ci.a))).replace(/^http:\/\//i, 'https://') });
    });

  }
  function A(it, cls, inner) { return '<a class="' + cls + '" href="' + esc(it.u) + '" target="_blank" rel="noopener noreferrer">' + inner + '</a>'; }

  function tixHTML(list) { return '<ul class="stk">' + list.map(function (it, i) { return '<li>' + A(it, '', '<img src="' + STK[i % STK.length] + '" alt="" width="112" height="112" decoding="async"><b>' + esc(it.t) + '</b>') + '</li>'; }).join('') + '</ul>'; }
  function pillsHTML(list) {
    return '<ul class="pills">' + list.map(function (it) {
      var m = /^([^\sA-Za-z0-9\u3040-\u30ff\u4e00-\u9fff〈〉「」『』]+)\s+(.+)$/.exec(it.t), e = m ? m[1] : '♪', t = m ? m[2] : it.t;
      var hasOP = /OP/.test(t), hasED = /ED/.test(t), k = hasOP && !hasED ? 'op' : hasED && !hasOP ? 'ed' : 'ot';
      return '<li>' + A(it, k, '<span class="e" aria-hidden="true">' + esc(e) + '</span><span>' + esc(t) + '</span>') + '</li>';
    }).join('') + '</ul>';
  }
  function ivHTML(list) {
    return '<ul class="list">' + list.map(function (it) {
      var m = '', t = it.t, i = t.indexOf('▍');
      if (i > 0) { m = t.slice(0, i).trim(); t = t.slice(i + 1).trim(); }
      var inner = '<div class="ivtop"><time datetime="' + (it.d ? it.d.key.replace(/\//g, '-') : '') + '">' + (it.d ? it.d.key : '') + '</time>' +
        (m ? '<span class="tag">' + esc(m) + '</span>' : '') + '</div><div class="ivt">' + esc(t) + '</div>';
      return '<li>' + A(it, 'iv', inner + ARROW) + '</li>';
    }).join('') + '</ul>';
  }
  function awdHTML(list) {
    return '<ul class="awd">' + list.map(function (it) {
      return '<li>' + A(it, '', MEDAL + '<span><time>' + (it.d ? it.d.key : '') + '</time><span class="at">' + esc(it.t) + '</span></span>') + '</li>';

  function behHTML(list) {

      return '<li>' + A(it, 'hc', (it.img ? '<span class="hp"><img src="' + esc(it.img) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer"></span>' : '<span class="hp nopic">封面待補</span>') +
        '<span class="hx">' + (dt ? '<span class="hd">' + dt + '</span>' : '') + '<span class="ht">' + esc(it.t) + '</span></span>') + '</li>';

  var HLC = ['#ffd9e2', '#cfe0fb', '#fff0a8'], hashDone = false, OPEN_ALWAYS = '彩弘花絮中字版', openSet = {};

  function render(items) {

    var by = {}; items.forEach(function (it) { (by[it.b] = by[it.b] || []).push(it); });
    var html = '', shown = [];
    if (by['精選連結']) html += tixHTML(by['精選連結']);
    BLOCKS.slice(1).forEach(function (b) {

    });

    navEl.hidden = shown.length < 2;

      var hi = -1; shown.forEach(function (b, i) { if (b === want || SHORT[b] === want) hi = i; });
      if (hi >= 0) setTimeout(function () { var el = $('fs-' + hi); if (el) { if (el.tagName === 'DETAILS') { el.open = true; openSet[shown[hi]] = true; } el.scrollIntoView({ block: 'start' }); } }, 60);
    }
    Array.prototype.forEach.call(listEl.querySelectorAll('.hp img'), function (img) {
      img.addEventListener('error', function () { if (img.parentNode) img.parentNode.remove(); });
    });
  }
  navEl.addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    Array.prototype.forEach.call(navEl.children, function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    var s = $('fs-' + b.dataset.i);
    if (s) { if (s.tagName === 'DETAILS') { s.open = true; openSet[s.dataset.b] = true; } s.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' }); }

  function showError() {
    listEl.innerHTML = '<div class="state">暫時讀不到內容，請稍後再試。<br><button type="button" id="retry">重新載入</button></div>';
    var r = $('retry'); if (r) r.addEventListener('click', load);

  function load() {
    var cached = getCache(CACHE_KEY);

    else listEl.innerHTML = '<div class="state">讀取內容中…</div>';
    fetch(CSV_URL, { cache: 'no-cache' }).then(function (r) {

      if (!items.length) throw new Error('empty');
      setCache(CACHE_KEY, t);

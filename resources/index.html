  --tape:rgba(238,90,109,.30); --tape-2:rgba(255,255,255,.55);
  --shadow:rgba(30,60,120,.22);

  --c-v-bg:#dbe6ff; --c-v-fg:#23409e; --c-v-dot:#3b5bdb;
  --c-s-bg:#ecdcf7; --c-s-fg:#6b1f87; --c-s-dot:#9c36b5;
  --c-z-bg:#ffe3d1; --c-z-fg:#9a3d06; --c-z-dot:#e8590c;
  --c-r-bg:#cdeff3; --c-r-fg:#0a5560; --c-r-dot:#0b7285;
  --c-m-bg:#fbdbe7; --c-m-fg:#94163f; --c-m-dot:#c2255c;
  --c-e-bg:#d6f0dc; --c-e-fg:#1f6a30; --c-e-dot:#2f9e44;
  --c-l-bg:#ffd9d9; --c-l-fg:#a82121; --c-l-dot:#e03131;
  --c-o-bg:#e2e7f0; --c-o-fg:#46546e; --c-o-dot:#7b8aa5;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:linear-gradient(180deg,var(--desk-1),var(--desk-2)) var(--desk-2);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--font-body);font-size:16px;line-height:1.6;
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100%;
}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:6px}

.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{
  display:inline-flex;align-items:center;gap:10px;min-height:56px;text-decoration:none;font-size:15px;cursor:pointer;
}
.back .sticker-slot{
  position:relative;overflow:hidden;width:60px;height:60px;border-radius:15px;font-size:10px;
  animation:nudge 4.8s ease-in-out infinite;transition:transform .2s;
}
.back .sticker-slot::after{
  content:"";position:absolute;inset:0;transform:translateX(-130%);
  background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.8) 50%,transparent 65%);
  animation:shine 4.8s ease-in-out infinite;
}
.back:hover .sticker-slot,.back:focus-visible .sticker-slot{animation:none;transform:rotate(4deg) scale(1.1)}
@keyframes nudge{
  0%,68%,100%{transform:rotate(-5deg) translateY(0)}
  76%{transform:rotate(-11deg) translateY(-4px)}
  84%{transform:rotate(2deg) translateY(-4px)}
  92%{transform:rotate(-7deg) translateY(0)}
}
@keyframes shine{0%,70%{transform:translateX(-130%)}92%,100%{transform:translateX(130%)}}

/* 點點紙 */
.sheet{
  position:relative;
  background:
    radial-gradient(circle,var(--paper-dot) 1.1px,transparent 1.3px) 0 0/22px 22px,
    var(--paper);
  border-radius:20px;
  padding:34px 26px 28px;
  box-shadow:0 22px 40px -22px var(--shadow),0 2px 0 var(--line) inset;
  display:flex;flex-direction:column;gap:18px;
}
.sheet::before,.sheet::after{
  content:"";position:absolute;top:-10px;width:92px;height:26px;
  background:repeating-linear-gradient(90deg,var(--tape-2) 0 7px,transparent 7px 14px),var(--tape);
  box-shadow:0 2px 4px -1px var(--shadow);
}
.sheet::before{left:26px;transform:rotate(-4deg)}
.sheet::after{right:26px;transform:rotate(3deg)}

.head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{
  margin:0;font-family:var(--font-hand);font-weight:400;
  font-size:clamp(44px,9vw,60px);line-height:1;letter-spacing:.04em;color:var(--denim);
}
.sticker-slot{
  width:68px;height:68px;border-radius:16px;transform:rotate(-5deg);
  background:repeating-linear-gradient(135deg,var(--surface-2) 0 8px,var(--line) 8px 16px);
  border:3px solid var(--surface);box-shadow:0 8px 14px -8px var(--shadow);
  display:grid;place-items:center;text-align:center;font-size:11px;line-height:1.3;color:var(--muted);font-weight:700;
}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.days + h2.sec,.past + h2.sec,.empty + h2.sec{margin-top:30px}
.chip{
  display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);font-size:14.5px;font-weight:500;
}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--dot,var(--muted))}
.chip small{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--denim);border-color:var(--denim);color:var(--denim-ink);font-weight:700}
.chip[aria-pressed="true"] small{color:inherit;opacity:.85}
.chip[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--denim-ink)}
h2.sec{
  margin:14px 0 14px;font-weight:400;font-size:26px;line-height:1.2;color:var(--denim);letter-spacing:.02em;
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
}
h2.sec small{font-family:var(--font-body);font-size:14px;color:var(--muted);letter-spacing:0}
.tag{
  display:inline-block;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;line-height:22px;
  background:var(--bg);color:var(--fg);
}
.v{--bg:var(--c-v-bg);--fg:var(--c-v-fg);--dot:var(--c-v-dot)}
.s{--bg:var(--c-s-bg);--fg:var(--c-s-fg);--dot:var(--c-s-dot)}
.z{--bg:var(--c-z-bg);--fg:var(--c-z-fg);--dot:var(--c-z-dot)}
.r{--bg:var(--c-r-bg);--fg:var(--c-r-fg);--dot:var(--c-r-dot)}
.m{--bg:var(--c-m-bg);--fg:var(--c-m-fg);--dot:var(--c-m-dot)}
.e{--bg:var(--c-e-bg);--fg:var(--c-e-fg);--dot:var(--c-e-dot)}
.l{--bg:var(--c-l-bg);--fg:var(--c-l-fg);--dot:var(--c-l-dot)}
.o{--bg:var(--c-o-bg);--fg:var(--c-o-fg);--dot:var(--c-o-dot)}
.foot{font-size:13px;color:var(--muted);line-height:1.6}

.tag.lead{--bg:var(--coral-soft);--fg:var(--coral)}
.tag.star{--bg:#fff3bf;--fg:#8a6100}
.tag.gen{--bg:var(--c-v-bg);--fg:var(--c-v-fg)}
.tag.plain{--bg:var(--surface-2);--fg:var(--muted)}
.lead-note{margin:-6px 0 0;font-size:13.5px;color:var(--muted);line-height:1.6}
.state{
  padding:26px 16px;text-align:center;color:var(--muted);font-size:14.5px;line-height:1.7;
  background:var(--surface);border:1px dashed var(--line);border-radius:16px;
}
.state button{
  margin-top:10px;min-height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface-2);cursor:pointer;font-weight:700;font-size:14px;
}
.totop{
  position:fixed;z-index:20;
  right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(18px + env(safe-area-inset-bottom,0px));
  width:52px;height:52px;border-radius:50%;padding:0;cursor:pointer;
  border:3px solid var(--surface);background:var(--denim);color:var(--denim-ink);
  display:grid;place-items:center;
  box-shadow:0 8px 14px -4px var(--shadow),0 2px 4px var(--shadow);
  opacity:0;transform:translateY(14px) scale(.9);pointer-events:none;
  transition:opacity .25s,transform .25s;
}
.totop[data-show="true"]{opacity:1;transform:none;pointer-events:auto}
.totop svg{width:22px;height:22px}
.totop:hover{transform:scale(1.06)}
@media (max-width:560px){.sheet{padding:30px 14px 22px;border-radius:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.back .sticker-slot,.back .sticker-slot::after{animation:none!important}}


:root{--n1:#fff6c9;--n2:#ffe3ea;--n3:#cdeefc;--n4:#dff5e6;--n5:#c3d2fb;--n-ink:#2b2a33;--n-line:rgba(60,50,40,.22)}
.notes{display:grid;gap:26px 18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));margin-top:22px}
.note{
  position:relative;min-width:0;padding:26px 16px 10px;color:var(--n-ink);
  background:var(--nbg);border-radius:3px 3px 16px 3px;
  box-shadow:0 12px 18px -14px var(--shadow),0 1px 2px var(--shadow);
  transform:rotate(var(--rot,0deg));
}
.note::before{
  content:"";position:absolute;top:-11px;left:50%;width:84px;height:22px;margin-left:-42px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.7) 0 6px,rgba(255,255,255,.35) 6px 12px);
  border:1px solid rgba(0,0,0,.06);transform:rotate(-2deg);
}
.note:nth-child(1){--nbg:var(--n5);--rot:-.5deg}
.note:nth-child(2){--nbg:var(--n3);--rot:.45deg}
.note:nth-child(3){--nbg:var(--n2);--rot:.35deg}
.note:nth-child(4){--nbg:var(--n1);--rot:-.4deg}
.note:nth-child(n+5){--nbg:var(--n4);--rot:.3deg}
.note h2{margin:0 0 6px;font-size:18px;font-weight:700;letter-spacing:.04em}
.note ul{list-style:none;margin:0;padding:0}
.note li{border-top:1px dashed var(--n-line)}
.note li:first-child{border-top:0}
.rl{
  display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 2px;color:inherit;text-decoration:none;
}
.rl .rt{flex:1;min-width:0}
.rl .rn{display:block;font-weight:500;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.rl .rd{display:block;font-size:12.5px;opacity:.72;line-height:1.5;overflow-wrap:anywhere}
.rl svg{flex:0 0 auto;width:16px;height:16px;opacity:.6}
a.rl:hover .rn{text-decoration:underline;text-underline-offset:3px}
a.rl:hover svg{opacity:1}
@media (prefers-reduced-motion:reduce){.note{transform:none}}

</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="../" id="back" aria-label="回貼紙簿" title="回貼紙簿"><span class="sticker-slot" aria-hidden="true">貼紙圖<br>貼紙簿</span></a>
  </div>
  <main class="sheet">
    <div class="head">
      <h1>相關資源</h1>
      <div class="sticker-slot" aria-hidden="true">貼紙圖<br>資源</div>
    </div>
    <p class="lead-note">官方帳號、影片與翻譯資源，點開會在新分頁前往。</p>
    <div id="resList"><div class="state">讀取中…</div></div>
    <p class="foot">連結整理自試算表，各網站內容屬於各權利人。</p>
  </main>
</div>
<button type="button" class="totop" id="toTop" aria-label="回到最上面" data-show="false"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 16V4M4.5 9.5 10 4l5.5 5.5"/></svg></button>
<script>
(function () {
  'use strict';
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTwvy-Oyq413ORq1Lxo22qGb6VnLp-1Zi2UyfDgIuwAsneVJh0XHZhwm5xagSJ7QGkxFHpHrsN4LKoD/pub?gid=2093214787&single=true&output=csv';
  var CACHE_KEY = 'shk-resources-csv-v1';
  var DEFAULT = [["個人", "加藤史帆官方Instagram", "https://www.instagram.com/katoshi.official/", ""], ["個人", "加藤史帆官方網站", "https://shihokato.com", ""], ["個人", "加藤史帆官方X", "https://x.com/kato_staff", ""], ["個人", "加藤史帆粉絲俱樂部", "https://yodel-app.com/s/yodel/page/shiho_kato?ima=1259", ""], ["個人", "1st寫真集 官方X", "https://x.com/katoshi_aloha", "日向坂46 加藤史帆 1st寫真集"], ["個人", "1st寫真集 官方TikTok", "https://www.tiktok.com/@katoshi_aloha", "日向坂46 加藤史帆 1st寫真集"], ["日向坂46", "官方YouTube（音樂）", "https://www.youtube.com/@46officialyoutubechannel99", ""], ["日向坂46", "官方YouTube（直播、Vlog）", "https://www.youtube.com/@hinatazakachannel", ""], ["日向坂46", "官方TikTok", "https://www.tiktok.com/@hinatazakanews", ""], ["字幕與翻譯", "真的晒字幕組（日向坂相關影片翻譯）", "https://space.bilibili.com/346794495", "bilibili"], ["字幕與翻譯", "真的晒字幕組（《在日向坂相會吧》完整全集）", "https://h46sub.cc/", ""], ["雜誌", "CanCam官方網站", "https://cancam.jp/", ""]];
  var $ = function (id) { return document.getElementById(id); };
  var listEl = $('resList');

  function parseCSV(t) {
    var rows = [], row = [], f = '', q = false;
    for (var i = 0; i < t.length; i++) {
      var c = t[i];
      if (q) {
        if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; }
        else f += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && t[i + 1] === '\n') i++;
        row.push(f); f = ''; rows.push(row); row = [];
      } else f += c;
    }
    if (f !== '' || row.length) { row.push(f); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (x) { return String(x).trim() !== ''; }); });
  }
  function idx(h, re) { for (var i = 0; i < h.length; i++) if (re.test(h[i])) return i; return -1; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function safeUrl(u) { u = String(u || '').trim(); return /^https?:\/\//i.test(u) ? u : ''; }
  function getCache(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function setCache(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  var ARROW = '<svg class="go" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v8M16 4 6 14"/></svg>';
  var smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var toTop = document.getElementById('toTop');
  function tagClass(t) { return t === '主演' ? 'lead' : t === '☆' ? 'star' : /期生/.test(t) ? 'gen' : 'plain'; }
  function tagsHTML(s) {
    return String(s || '').split(/[、,，\s]+/).filter(Boolean).map(function (t) {
      return '<span class="tag ' + tagClass(t) + '">' + esc(t) + '</span>';
    }).join('');
  }
  function onScrollTop() { toTop.dataset.show = window.pageYOffset > 480 ? 'true' : 'false'; }
  toTop.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: smooth ? 'smooth' : 'auto' }); });

  function toItems(rows) {
    if (!rows.length) return [];
    var h = rows[0].map(function (s) { return String(s || '').trim(); });
    var ci = { g: idx(h, /^分組|^分類/), n: idx(h, /^名稱/), u: idx(h, /^網址|^連結/), d: idx(h, /^說明/) };
    var out = [];
    rows.slice(1).forEach(function (r) {
      function g(i) { return i >= 0 && r[i] != null ? String(r[i]).trim() : ''; }
      var n = g(ci.n), u = safeUrl(g(ci.u));
      if (!n || !u) return;
      out.push({ g: g(ci.g) || '其他', n: n, u: u, d: g(ci.d) });
    });
    return out;
  }
  function render(items) {
    if (!items.length) { listEl.innerHTML = '<div class="state">目前還沒有資源連結。</div>'; return; }
    var groups = [], map = {};
    items.forEach(function (it) {
      if (!map[it.g]) { map[it.g] = []; groups.push(it.g); }
      map[it.g].push(it);
    });
    listEl.innerHTML = '<div class="notes">' + groups.map(function (g) {
      return '<section class="note"><h2>' + esc(g) + '</h2><ul>' + map[g].map(function (it) {
        return '<li><a class="rl" href="' + esc(it.u) + '" target="_blank" rel="noopener noreferrer"><span class="rt"><span class="rn">' + esc(it.n) + '</span>' +
          (it.d ? '<span class="rd">' + esc(it.d) + '</span>' : '') + '</span>' + ARROW.replace(' class="go"', '') + '</a></li>';
      }).join('') + '</ul></section>';
    }).join('') + '</div>';
  }
  function load() {
    var cached = getCache(CACHE_KEY), shown = false;
    if (cached) { try { var c = toItems(parseCSV(cached)); if (c.length) { render(c); shown = true; } } catch (e) {} }
    if (!shown) render(DEFAULT.map(function (r) { return { g: r[0], n: r[1], u: r[2], d: r[3] }; }));
    fetch(CSV_URL, { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function (t) {
      var items = toItems(parseCSV(t));
      if (!items.length) throw new Error('empty');
      setCache(CACHE_KEY, t);
      render(items);
    }).catch(function (e) { if (window.console) console.warn('相關資源讀取失敗，使用內建清單', e); });
  }
  window.addEventListener('scroll', onScrollTop, { passive: true });
  onScrollTop();
  load();
})();
</script>
